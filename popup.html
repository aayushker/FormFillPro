<!DOCTYPE html>
<html>
<head>
  <title>AutoFill Control</title>
  <style>
    body { font-family: sans-serif; padding: 10px; width: 250px; }
    input { width: 100%; margin: 5px 0; }
    button { margin-top: 10px; width: 100%; }
  </style>
</head>
<body>
  <h3>AutoFormFiller</h3>
  <button id="fill">Fill Current Form</button>
  <button id="edit">Edit My Info</button>
  <input type="file" id="envUpload" style="display: none;" />
  <button id="import">Import .env</button>
  <button id="export">Export .env</button>

  <div id="form" style="display: none;">
    <input type="text" id="name" placeholder="Name" />
    <input type="email" id="email" placeholder="Email" />
    <input type="text" id="college" placeholder="College" />
    <input type="text" id="phone" placeholder="Phone" />
    <button id="save">Save Info</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
